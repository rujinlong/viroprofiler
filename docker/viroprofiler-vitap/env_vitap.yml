name: viroprofiler-vitap
channels:
    - conda-forge
    - bioconda
dependencies:
    # `ps`, which nextflow calls to collect per-task resource metrics.
    - conda-forge::procps-ng=4.0.0
    # VITAP 1.7.1 declares `python_requires='>=3.9'`; its own environment file
    # pins 3.12.
    - python=3.12
    - pip
    # The three external executables `VITAP assignment` runs. All have
    # linux-aarch64 builds in bioconda, which is why this image needs no
    # emulation -- unlike viroprofiler-host and viroprofiler-dvf.
    #
    # `prodigal`, not `prodigal-gv`: VITAP's own environment file lists
    # prodigal-gv, but VITAP_assignment_20241007.py calls the executable
    # `prodigal`, and the prodigal-gv package installs its binary under the name
    # `prodigal-gv` only.
    - bioconda::diamond=2.1.16
    - bioconda::seqkit
    - bioconda::prodigal=2.6.3
    # Python runtime dependencies of the assignment step. Deliberately not
    # installed through pip from VITAP's own `install_requires`, which lists the
    # conda-only tools above as if they were PyPI distributions.
    #
    # pandas is held below 3: VITAP 1.7.1 was developed against the 2.1 series
    # (its environment file pins `pandas=2.1`), and pandas 3 changes
    # copy-on-write and string dtype semantics throughout. This is the same trap
    # that broke vConTACT2 in docker/viroprofiler-taxa/env_taxa.yml.
    - conda-forge::pandas>=2.1,<3
    - conda-forge::numpy>=1.25
    - conda-forge::networkx>=3.1
    - conda-forge::biopython>=1.78
    - conda-forge::tqdm>=4.65
    # DB_VITAP downloads and unpacks the published database with these; the
    # mambaorg base image carries neither.
    - conda-forge::wget
    - conda-forge::unzip
    # `entrez-direct` is what `VITAP upd` uses to fetch VMR genomes from GenBank
    # one accession at a time. It is left out because this image never runs
    # `upd`: DB_VITAP installs the published pre-built database instead, for the
    # reasons given in docker/viroprofiler-vitap/Dockerfile.
