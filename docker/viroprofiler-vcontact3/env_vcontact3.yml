name: viroprofiler-vcontact3
channels:
    - conda-forge
    - bioconda
dependencies:
    # `ps`, which nextflow calls to collect per-task resource metrics.
    - conda-forge::procps-ng=4.0.0
    # vConTACT3 3.2.4 declares `Requires-Python: >=3.10,<3.12`.
    - python=3.11
    - pip
    # The only external executable vConTACT3 looks up and requires. Held at the
    # version the rest of the pipeline uses so that the databases DB_VCONTACT3
    # verifies with `mmseqs dbtype` are read by the same release that later
    # searches them.
    - bioconda::mmseqs2=17.b804f
    # vConTACT3 3.2.4 never invokes diamond -- `find_tools` looks up only
    # `mmseqs` and `vclust`, and no module in the package mentions diamond.
    # Kept because it is cheap and vConTACT2's protein-similarity step used it,
    # so a site pinning an older vConTACT3 still finds it.
    - bioconda::diamond
    # TAXONOMY_VCONTACT3 applies the --contig_minlen_vcontact3 filter with this.
    - bioconda::seqkit
    # merge_taxonomy.py, run by TAXONOMY_MERGE.
    - click
    # pandas comes in as a vConTACT3 dependency via pip; it is not listed here so
    # that pip resolves it against vConTACT3's own `pandas>=2.1.1` pin rather
    # than conda pinning a version pip then has to replace.
