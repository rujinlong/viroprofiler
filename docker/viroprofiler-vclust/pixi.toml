# ---------------------------------------------------------------------------
# ViroProfiler Vclust image (process label: viroprofiler_vclust)
#
# Vclust dereplicates the pooled contig library: a Kmer-db prefilter narrows the
# candidate pairs, LZ-ANI aligns the survivors, and the clustering step applies
# the MIUViG containment rule.
# ---------------------------------------------------------------------------
[workspace]
name = "viroprofiler-vclust"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# Kmer-db prefilter + LZ-ANI aligner + clustering, used by CONTIGLIB_CLUSTER.
vclust = "1.3.1.*"
# seqkit pulls the representative contigs out of the library, samtools writes
# the sequence dictionary the binning modules read.
seqkit = "2.10.0.*"
samtools = "1.21.*"
# `ps`, which Nextflow's trace observer calls for per-task resource metrics.
procps-ng = "4.0.0.*"
