name: viroprofiler-dram
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::procps-ng=4.0.0
  - python=3.10
  # pkg_resources, which DRAM's mag_annotator imports, was dropped in setuptools 81.
  - setuptools<81
  - pandas
  - pytest
  - scikit-bio
  - prodigal
  - mmseqs2=17.b804f
  - hmmer!=3.3.1
  - trnascan-se>=2
  - sqlalchemy
  - barrnap
  - altair>=4
  - openpyxl
  - networkx
  - ruby
  - parallel
  - dram
  - click
  - scipy