# ---------------------------------------------------------------------------
# ViroProfiler base image (process label: viroprofiler_base)
#
# The most widely shared image: CheckV, the contig library, VIRCONTIGS_PRE, gene
# prediction, TAXONOMY_MERGE and most DB_* processes all run here.
#
# Two environments, each with its OWN solve-group. They exist because CheckV
# pins numpy 1.23.1, which the rest of the base tools do not accept, and a
# shared solve-group would recreate that conflict.
#
# One fact about how tools resolve here is load-bearing: `prodigal-gv` and
# `hmmsearch` are NOT declared in [feature.base]. GENEPRED, MICOMPLETEDB and
# VOGDB call them by bare name and get CheckV's copies, because
# `envs/checkv/bin` is on PATH. Declaring them in the base feature would put a
# different build first on PATH for CheckV's own internal calls too, which is a
# change to what CheckV runs, not a packaging change. Whoever edits
# [feature.checkv] should know those three processes depend on it.
#
# VirSorter2 is not here: every process that runs it carries the
# `viroprofiler_virsorter2` label and gets docker/viroprofiler-virsorter2.
# ---------------------------------------------------------------------------
[workspace]
name = "viroprofiler-base"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64"]

[feature.base.dependencies]
# `ps`, which Nextflow's trace observer calls for per-task resource metrics.
procps-ng = "4.0.0.*"
bbmap = "*"
seqkit = "*"
samtools = "*"
blast = "*"
click = "*"
pandas = "*"
biopython = "*"
csvtk = "*"
wget = "*"
curl = "*"
pigz = "*"
coverm = "*"
# Held at the version DB_VCONTACT3 verifies its databases with, so the release
# that checks a database is the release that later searches it.
mmseqs2 = "17.b804f.*"
unzip = "*"

[feature.checkv.dependencies]
checkv = "1.0.1.*"
# CheckV 1.0.1 calls np.int/np.float, removed in numpy 1.24.
numpy = "1.23.1.*"

[environments]
base = { features = ["base"], solve-group = "base" }
checkv = { features = ["checkv"], solve-group = "checkv" }
