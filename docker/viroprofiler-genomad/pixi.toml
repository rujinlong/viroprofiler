# ---------------------------------------------------------------------------
# ViroProfiler geNomad image (process labels: viroprofiler_genomad)
#
# geNomad is the reference-free virus caller. The version is pinned because
# geNomad refuses to run against a database built for a different major version
# of its marker set; DB_GENOMAD downloads the matching release.
# ---------------------------------------------------------------------------
[workspace]
name = "viroprofiler-genomad"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# `ps`, which Nextflow's trace observer calls for per-task resource metrics.
procps-ng = "*"
# geNomad pulls in the two executables it shells out to, `mmseqs` and `aragorn`.
# Both have linux-aarch64 builds, which is why this image is buildable on arm64
# where the DeepVirFinder image it replaces was not.
genomad = "1.12.0.*"
# The GENOMAD process reshapes geNomad's summary tables with these.
seqkit = "*"
csvtk = "*"
