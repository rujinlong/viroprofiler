name: viroprofiler-taxa
channels:
    - conda-forge
    - bioconda
dependencies:
    - conda-forge::procps-ng=4.0.0
    - python=3.10
    # pkg_resources, which vcontact2 imports, was dropped in setuptools 81.
    - setuptools<81
    - bioconda::vcontact2
    - bioconda::prodigal-gv
    - bioconda::seqkit
    - bioconda::csvtk
    # vcontact2 0.11.3 only declares lower bounds (numpy >=1.20, pandas >=1.0.5,
    # scipy >=1.6), so a fresh solve pulls in versions from years after it was written and
    # it breaks: numpy 1.24 removed np.warnings, and scipy's COO refactor rejects the zip
    # iterator vcontact2 passes to sparse.coo_matrix ("mismatching number of index arrays
    # for shape; got 0, expected 2"). Hold all three at the release's own era.
    - numpy<1.24
    - scipy<1.12
    - pandas<2
    - click
    - wget
    # vcontact2 shells out to these at run time. The 0.11.1 recipe declared them
    # (diamond 2.0.6, mcl 14.137, java-jdk 8.0.112, taxonkit 0.12.0); 0.11.3 dropped the
    # declarations, so they have to be supplied here or vcontact2 aborts with
    # "Could not find <tool> in $PATH".
    - bioconda::diamond
    - bioconda::mcl
    - bioconda::blast
    - bioconda::taxonkit
    # ClusterONE, which vcontact2 uses for viral-cluster generation, is a Java jar.
    - openjdk
