name: viroprofiler-taxa
channels:
    - conda-forge
    - bioconda
dependencies:
    - conda-forge::procps-ng=4.0.0
    - python=3.10
    # pkg_resources, which vcontact2 imports, was dropped in setuptools 81.
    - setuptools<81
    - bioconda::vcontact2
    - bioconda::prodigal-gv
    - bioconda::seqkit
    - bioconda::csvtk
    # vcontact2 calls np.warnings, which numpy 1.24 removed.
    - numpy<1.24
    - pandas
    - click
    - wget
