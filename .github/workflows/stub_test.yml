name: Stub pipeline test

on:
  push:
    branches:
      - main
      - dev_ru
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  stub_viroprofiler:
    name: Stub test - VIROPROFILER (PE reads)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -stub \
            -profile test_stub \
            --outdir output_stub \
            2>&1 | tee nextflow_stub.log

      - name: Verify success
        run: |
          if grep -q "ERROR ~" nextflow_stub.log; then
            echo "=== Errors found ==="
            grep "ERROR ~" nextflow_stub.log
            exit 1
          fi
          grep -q "Succeeded\|Pipeline completed successfully" nextflow_stub.log || \
            { echo "Pipeline did not report success"; tail -20 nextflow_stub.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-viroprofiler-logs
          path: |
            nextflow_stub.log
            .nextflow.log
            output_stub/pipeline_info/

  stub_viroprofiler_se:
    name: Stub test - VIROPROFILER (SE reads)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -stub \
            -profile test_stub \
            --input tests/data/samplesheet_stub_se.csv \
            --single_end true \
            --outdir output_stub_se \
            2>&1 | tee nextflow_stub_se.log

      - name: Verify success
        run: |
          if grep -q "ERROR ~" nextflow_stub_se.log; then
            echo "=== Errors found ==="
            grep "ERROR ~" nextflow_stub_se.log
            exit 1
          fi
          grep -q "Succeeded\|Pipeline completed successfully" nextflow_stub_se.log || \
            { echo "Pipeline did not report success"; tail -20 nextflow_stub_se.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-viroprofiler-se-logs
          path: |
            nextflow_stub_se.log
            .nextflow.log

  stub_contiganno:
    name: Stub test - CONTIGANNO workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -stub \
            -profile test_stub \
            --input_contigs tests/data/stub_contigs.fasta \
            --outdir output_stub_contiganno \
            2>&1 | tee nextflow_stub_contiganno.log

      - name: Verify success
        run: |
          if grep -q "ERROR ~" nextflow_stub_contiganno.log; then
            echo "=== Errors found ==="
            grep "ERROR ~" nextflow_stub_contiganno.log
            exit 1
          fi
          grep -q "Succeeded\|Pipeline completed successfully" nextflow_stub_contiganno.log || \
            { echo "Pipeline did not report success"; tail -20 nextflow_stub_contiganno.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-contiganno-logs
          path: |
            nextflow_stub_contiganno.log
            .nextflow.log

  stub_setup:
    name: Stub test - DB setup workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -stub \
            -profile test_stub \
            --mode setup \
            --outdir output_stub_setup \
            2>&1 | tee nextflow_stub_setup.log

      - name: Verify success
        run: |
          if grep -q "ERROR ~" nextflow_stub_setup.log; then
            echo "=== Errors found ==="
            grep "ERROR ~" nextflow_stub_setup.log
            exit 1
          fi
          grep -q "Succeeded\|Pipeline completed successfully" nextflow_stub_setup.log || \
            { echo "Pipeline did not report success"; tail -20 nextflow_stub_setup.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-setup-logs
          path: |
            nextflow_stub_setup.log
            .nextflow.log

  stub_optional_modules:
    name: Stub test - optional modules (eggnog, abricate, vrhyme)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -stub \
            -profile test_stub \
            --use_eggnog true \
            --use_abricate true \
            --binning vrhyme \
            --use_vibrant false \
            --outdir output_stub_opts \
            2>&1 | tee nextflow_stub_opts.log

      - name: Verify success
        run: |
          if grep -q "ERROR ~" nextflow_stub_opts.log; then
            echo "=== Errors found ==="
            grep "ERROR ~" nextflow_stub_opts.log
            exit 1
          fi
          grep -q "Succeeded\|Pipeline completed successfully" nextflow_stub_opts.log || \
            { echo "Pipeline did not report success"; tail -20 nextflow_stub_opts.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-optional-logs
          path: |
            nextflow_stub_opts.log
            .nextflow.log

  stub_binning_phamb:
    name: Stub test - PHAMB binning (amd64 only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PHAMB classifies VAMB's clusters and VAMB has no linux-aarch64 build, so
    # WorkflowViroprofiler.binningIsAvailable() refuses this combination on arm64. The
    # GitHub runner is x86-64, which makes CI the only place this path is exercised.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -stub \
            -profile test_stub \
            --binning phamb \
            --use_phamb true \
            --outdir output_stub_phamb \
            2>&1 | tee nextflow_stub_phamb.log

      - name: Verify success and that PHAMB actually ran
        run: |
          if grep -q "ERROR ~" nextflow_stub_phamb.log; then
            echo "=== Errors found ==="
            grep "ERROR ~" nextflow_stub_phamb.log
            exit 1
          fi
          for proc in vMAG_PHAMB:VAMB vMAG_PHAMB:PHAMB_DVF_TABLE vMAG_PHAMB:PHAMB_RF; do
            grep -q "$proc" nextflow_stub_phamb.log || \
              { echo "$proc did not run"; exit 1; }
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-phamb-logs
          path: |
            nextflow_stub_phamb.log
            .nextflow.log

  stub_modes:
    name: Stub test - --mode ladder
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Each mode must run its own stages and stop. A stage list that silently grows is the
    # defect this guards: before the modes were implemented, `--mode fastqc` ran assembly
    # and CheckV.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"

      - name: Each mode stops where it should
        run: |
          set -euo pipefail
          run_mode () {
            nextflow run main.nf -stub -profile test_stub \
              --mode "$1" --outdir "output_stub_mode_$1" 2>&1 | tee "mode_$1.log"
          }
          must_run ()     { grep -q ":$2\b"  "mode_$1.log" || { echo "mode $1: $2 should have run";     exit 1; }; }
          must_not_run () { grep -q ":$2\b" "mode_$1.log" && { echo "mode $1: $2 should NOT have run"; exit 1; }; true; }

          run_mode fastqc
          must_run     fastqc FASTQC
          must_not_run fastqc FASTP
          must_not_run fastqc SPADES

          run_mode fastp
          must_run     fastp FASTP
          must_not_run fastp SPADES

          run_mode contiglib
          must_run     contiglib CONTIGLIB_CLUSTER
          must_not_run contiglib GENOMAD

          run_mode all
          must_run all RESULTS_TSE

      - name: A mode that names no stage is rejected
        run: |
          if nextflow run main.nf -stub -profile test_stub --mode bogus \
               --outdir output_stub_mode_bogus > mode_bogus.log 2>&1; then
            echo "--mode bogus was accepted"; exit 1
          fi
          grep -q "not a valid choice" mode_bogus.log || \
            { echo "rejected, but not by the schema"; cat mode_bogus.log; exit 1; }

      - name: '--mode fastqc with --reads_type clean is rejected'
        run: |
          if nextflow run main.nf -stub -profile test_stub --mode fastqc --reads_type clean \
               --outdir output_stub_mode_clean > mode_clean.log 2>&1; then
            echo "the empty combination was accepted"; exit 1
          fi
          grep -q "has nothing to do with" mode_clean.log || \
            { echo "rejected, but not for the expected reason"; cat mode_clean.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-mode-logs
          path: |
            mode_*.log
            .nextflow.log
