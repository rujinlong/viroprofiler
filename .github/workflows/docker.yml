name: Docker

on:
  push:
    tags:
      - "v*"
      - "docker*"

jobs:
  # The lockfiles are what make the images reproducible, so verify them on every push --
  # a lock nothing checks is a comment. `--dry-run` is required: plain `pixi lock --check`
  # exits non-zero on drift but REWRITES pixi.lock while doing so, leaving CI with a dirty
  # tree and the drift silently absorbed.
  check_locks:
    name: pixi.lock matches pixi.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.73.0
          run-install: false

      - name: Verify every lockfile is up to date
        run: |
          status=0
          for manifest in docker/*/pixi.toml; do
              dir=$(dirname "$manifest")
              if pixi lock --check --dry-run --manifest-path "$manifest"; then
                  echo "OK    $dir"
              else
                  echo "STALE $dir -- run 'pixi lock' there, re-test the image, and commit the result"
                  status=1
              fi
          done
          exit $status

  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # - dockerfile: ./docker/viroprofiler-base/Dockerfile
          #   image: denglab/viroprofiler-base
          # - dockerfile: ./docker/viroprofiler-binning/Dockerfile
          #   image: denglab/viroprofiler-binning
          # - dockerfile: ./docker/viroprofiler-geneannot/Dockerfile
          #   image: denglab/viroprofiler-geneannot
          # - dockerfile: ./docker/viroprofiler-host/Dockerfile
          #   image: denglab/viroprofiler-host
          # - dockerfile: ./docker/viroprofiler-replicyc/Dockerfile
          #   image: denglab/viroprofiler-replicyc
          # - dockerfile: ./docker/viroprofiler-vcontact3/Dockerfile
          #   image: denglab/viroprofiler-vcontact3
          # - dockerfile: ./docker/viroprofiler-abundance/Dockerfile
          #   image: denglab/viroprofiler-abundance
          # - dockerfile: ./docker/viroprofiler-vibrant/Dockerfile
          #   image: denglab/viroprofiler-vibrant
          # - dockerfile: ./docker/viroprofiler-bracken/Dockerfile
          #   image: denglab/viroprofiler-bracken
          # - dockerfile: ./docker/viroprofiler-virsorter2/Dockerfile
          #   image: denglab/viroprofiler-virsorter2
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: "."
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
