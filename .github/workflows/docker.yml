name: Docker

# Runs on any change under docker/, not only on a tag. Firing on tags alone made the
# lockfile gate below unreachable in practice: the images and their locks are edited on
# branches, and by the time a tag exists the drift is already released.
on:
  push:
    branches: [main, dev_ru]
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  # The lockfiles are what make the images reproducible, so verify them on every push --
  # a lock nothing checks is a comment. `--dry-run` is required: plain `pixi lock --check`
  # exits non-zero on drift but REWRITES pixi.lock while doing so, leaving CI with a dirty
  # tree and the drift silently absorbed.
  check_locks:
    name: pixi.lock matches pixi.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.73.0
          run-install: false

      - name: Verify every lockfile is up to date
        run: |
          status=0
          for manifest in docker/*/pixi.toml; do
              dir=$(dirname "$manifest")
              if pixi lock --check --dry-run --manifest-path "$manifest"; then
                  echo "OK    $dir"
              else
                  echo "STALE $dir -- run 'pixi lock' there, re-test the image, and commit the result"
                  status=1
              fi
          done
          exit $status


# The image build and push job lived here and has been removed: its `matrix.include` was
# entirely commented out, which YAML reads as `include: null`. GitHub rejects an empty
# matrix, and it rejects it at parse time -- so the whole file was invalid, `check_locks`
# never ran once, and every push produced a failed run with no jobs in it. A gate that
# cannot be parsed is worse than no gate, because the repository still claims to have one.
#
# To restore it (docs/HANDOFF.md, "Not done yet" item 3), recover the job from
# `git log -- .github/workflows/docker.yml` and give the matrix a real list. Note the list
# that was commented out is stale: it names ten images and docker/ now holds sixteen --
# checkamg, genomad, qc, vclust, viewer and vitap were never added. Restoring it verbatim
# would publish a subset while looking like a full build.
