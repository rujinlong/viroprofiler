name: Docker

# Runs on any change under docker/, not only on a tag. Firing on tags alone made the
# lockfile gate below unreachable in practice: the images and their locks are edited on
# branches, and by the time a tag exists the drift is already released.
on:
  push:
    branches: [main, dev_ru]
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  # The lockfiles are what make the images reproducible, so verify them on every push --
  # a lock nothing checks is a comment. `--dry-run` is required: plain `pixi lock --check`
  # exits non-zero on drift but REWRITES pixi.lock while doing so, leaving CI with a dirty
  # tree and the drift silently absorbed.
  check_locks:
    name: pixi.lock matches pixi.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.73.0
          run-install: false

      - name: Verify every lockfile is up to date
        run: |
          status=0
          for manifest in docker/*/pixi.toml; do
              dir=$(dirname "$manifest")
              if pixi lock --check --dry-run --manifest-path "$manifest"; then
                  echo "OK    $dir"
              else
                  echo "STALE $dir -- run 'pixi lock' there, re-test the image, and commit the result"
                  status=1
              fi
          done
          exit $status


# NOTHING HERE PUSHES TO DOCKER HUB. The job that did was removed: its `matrix.include`
# had every entry commented out, which YAML reads as `include: null`. GitHub rejects an
# empty matrix at parse time, so the whole file was invalid, `check_locks` never ran once,
# and every push produced a failed run with no jobs in it. A gate that cannot be parsed
# fails in the same direction as one that passes -- the repository kept claiming a
# guarantee it had stopped providing.
#
# Publishing is docs/HANDOFF.md "Not done yet" item 1. To restore that job, recover it
# from `git log -- .github/workflows/docker.yml` and give the matrix a real list -- and
# note the list that was commented out is stale: ten images named, sixteen present under
# docker/, with checkamg, genomad, qc, vclust, viewer and vitap missing. Restoring it
# verbatim would publish a subset while looking like a full build.

  # First amd64 build of anything in this repository. Every image so far was built
  # natively on aarch64, so "it builds" is an untested claim on x86-64 -- and the
  # PHAMB path cannot be exercised anywhere else, because VAMB has no linux-aarch64
  # build at all.
  #
  # Only the two images that path needs: VAMB and PHAMB_RF carry the
  # `viroprofiler_binning` label, and GENEPRED/MICOMPLETEDB/VOGDB/PHAMB_DVF_TABLE
  # carry `viroprofiler_base`. Building all sixteen would take hours and prove
  # nothing extra about PHAMB.
  #
  # Nothing is pushed. Each Dockerfile ends with an `env -i` smoke test that
  # exercises its tools under the image's own PATH, so a successful build is also
  # a successful smoke test -- which is the whole result being sought here.
  build_phamb_images:
    name: amd64 build - ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [viroprofiler-base, viroprofiler-binning]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # A default runner has ~14 GB free, and these images do not fit beside the
      # preinstalled Android SDK and .NET toolchains.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: ./docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: denglab/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
