name: PHAMB real run

# Exercises the PHAMB path on x86-64, which is the only place it can run: VAMB has
# no linux-aarch64 build, and the only x86-64 host on the development network has
# 7 GB of RAM.
#
# It stops at VAMB, and that is the finding rather than a fault. VAMB trains a
# variational autoencoder and needs at least one batch -- 256 contigs by default.
# The reference run yields 161 contigs, 102 of them viral, 77 of those at or above
# --binning_minlen_contig. No fixture drawn from it can reach 256, so **this
# dataset cannot answer "does VAMB bin correctly"** and no amount of rearranging
# it will. What the job does establish, on real data:
#
#   * DB_VOGDB and DB_MICOMPLETEDB build and verify their databases (I-56)
#   * a --db that does not exist yet is created correctly (I-57)
#   * PHAMB_DVF_TABLE and GENEPRED4BIN run, on amd64
#   * VAMB's depth table is built and its row-count assertion passes, which is
#     the I-44 fix -- the BAMs cover 161 contigs and the FASTA 102
#   * the size guard fires with a message naming both numbers and a way out
#
# Answering the binning question itself needs a library of a few hundred viral
# contigs, which means a different dataset.
#
# Manual by default, plus the files that would invalidate any of the above.
on:
  workflow_dispatch:
  push:
    paths:
      - "subworkflows/local/vMAG.nf"
      - "modules/local/binning.nf"
      - "phamb_entry.nf"
      - "assets/test_phamb/**"
      - "docker/viroprofiler-binning/**"
      - ".github/workflows/phamb.yml"

jobs:
  phamb:
    name: PHAMB path up to VAMB's size limit
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # The databases do not fit a default runner beside its preinstalled toolchains.
      # VOGDB peaks at ~9.5 GB while being built -- a 554 MB archive, 49116 unpacked
      # profiles and the 4.4 GB concatenation of them -- settling to 4.4 GB, and
      # CheckV adds 6.4 GB. Two images on top of that.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=26.04.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged exactly as conf/modules.config names them, so Nextflow finds these
      # locally and never pulls. That matters: the v0.2 tags on Docker Hub predate
      # the pixi migration and are NOT what this repository builds today.
      - name: Build viroprofiler-base
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: ./docker/viroprofiler-base/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: denglab/viroprofiler-base:v0.2
          cache-from: type=gha,scope=viroprofiler-base
          cache-to: type=gha,mode=max,scope=viroprofiler-base

      - name: Build viroprofiler-binning
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: ./docker/viroprofiler-binning/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: denglab/viroprofiler-binning:v0.2
          cache-from: type=gha,scope=viroprofiler-binning
          cache-to: type=gha,mode=max,scope=viroprofiler-binning

      # Through the real DB_* processes, not a shell script: both were broken until
      # recently (I-56) in ways their own content checks now catch, so building them
      # here is what keeps that fixed.
      - name: Build the databases PHAMB needs
        run: |
          # Create --db on the host first. Docker creates a missing bind-mount
          # source itself, as root, and the container runs as the invoking user
          # (docker.runOptions = -u $(id -u):$(id -g)) -- so a --db path that does
          # not exist yet becomes a directory the pipeline cannot write into, and
          # the first DB_* process dies on `mkdir: Permission denied` several
          # hundred MB into a download.
          mkdir -p "$PWD/phamb_db"

          nextflow run phamb_entry.nf \
            -profile docker \
            --phamb_stage databases \
            --mode setup \
            --db "$PWD/phamb_db" \
            --max_cpus 4 --max_memory 12.GB
          echo "--- what was published ---"
          ls -la phamb_db/vogdb phamb_db/micomplete phamb_db/checkv
          echo "vogdb profiles:      $(grep -c '^HMMER3/' phamb_db/vogdb/AllVOG.hmm)"
          echo "micomplete profiles: $(grep -c '^HMMER3/' phamb_db/micomplete/Bact105.hmm)"
          du -sh phamb_db/*
          df -h /

      # Expected to fail, at VAMB, for the reason in the header. `|| true` would
      # hide a failure anywhere else, so capture the log and assert on its content.
      - name: Run the PHAMB path
        run: |
          set +e
          nextflow run phamb_entry.nf \
            -profile docker \
            --db "$PWD/phamb_db" \
            --outdir "$PWD/phamb_out" \
            --phamb_contigs assets/test_phamb/putative_vcontigs.fasta \
            --phamb_genomad assets/test_phamb/genomad_virus_summary.tsv \
            --phamb_bams 'assets/test_phamb/bams/*.bam' \
            --max_cpus 4 --max_memory 12.GB > run.log 2>&1
          echo "nextflow exit: $?"
          set -e
          tail -40 run.log

      - name: Check what came out
        run: |
          echo "--- processes that produced output ---"
          find phamb_out -type f | sort

          # Everything upstream of VAMB has to have run.
          test -s phamb_out/phamb/all.DVF.predictions.txt
          head -1 phamb_out/phamb/all.DVF.predictions.txt | grep -qP '^name\tlen\tscore\tpvalue$'
          echo "PHAMB_DVF_TABLE: $(( $(wc -l < phamb_out/phamb/all.DVF.predictions.txt) - 1 )) contigs scored"

          test -s phamb_out/genepred4bin/genes_input4bin.faa
          echo "GENEPRED4BIN: $(grep -c '^>' phamb_out/genepred4bin/genes_input4bin.faa) proteins"

          # VAMB must fail on the size guard, not on anything else. Both halves
          # matter: a different failure means something actually broke, and no
          # failure means the guard stopped working.
          if ! grep -q "VAMB cannot bin this library" run.log; then
              echo "::error::VAMB did not stop on the size guard." >&2
              echo "Either it got further than this dataset allows -- in which case" >&2
              echo "the guard is broken -- or it failed for another reason entirely." >&2
              grep -E "Error executing process|Caused by" -A3 run.log >&2 || true
              exit 1
          fi
          grep -A5 "VAMB cannot bin this library" run.log

          # And the depth table must have been built before the guard was reached:
          # that is the I-44 fix, and the only place it runs on real BAMs.
          if grep -qE "depth rows \([0-9]+\) != contigs passing" run.log; then
              echo "::error::The depth table did not line up with the FASTA (I-44)." >&2
              exit 1
          fi
          echo "Depth table built and row-count assertion passed."

      - name: Keep the logs whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phamb-run
          path: |
            phamb_out/
            run.log
            .nextflow.log
          retention-days: 14
          if-no-files-found: warn
